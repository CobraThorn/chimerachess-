# Railway — CHIMERA Data API
# https://docs.railway.app/reference/config-as-code
#
# 1. railway.app → New Project → Deploy from GitHub
# 2. Add Volume: mount path /app/server/data (1 GB+)
# 3. Set CHIMERA_DATA_DIR=/app/server/data in Variables
# 4. Generate domain → copy URL into VITE_CHIMERA_API_URL

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/chimera/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
