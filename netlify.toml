# Netlify — CHIMERA frontend (static dist/)
# Build env: set VITE_CHIMERA_API_URL in Netlify UI → Site settings → Environment variables

[build]
  command = "npm run build"
  publish = "dist"

# Leave VITE_CHIMERA_API_URL unset so the app uses same-origin /api/chimera (proxy below).
# Only set it in Netlify UI if you intentionally bypass the proxy.

# Proxy API to Render (before SPA fallback).
[[redirects]]
  from = "/api/chimera/*"
  to = "https://chimerachess-0so2.onrender.com/api/chimera/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
